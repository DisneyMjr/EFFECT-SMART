name: Gerar Linux Effect Smart
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
      - uses: Swatinem/rust-cache@v2
      - name: Dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev libvulkan-dev libgl1-mesa-dev zsync desktop-file-utils
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: Instalar nfpm
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.47.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Gerar Linux
        run: bash packaging/linux/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: effect-smart-linux
          path: dist/release/*linux-x86_64*
          if-no-files-found: error
